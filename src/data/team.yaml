# People on the People page and the home page. Everyone listed here is bolded in author lists
# (nicknames in quotes or parentheses are ignored when matching, so “Bingsheng ‘Arthur’ Yao” matches “Bingsheng Yao”).
#   group: core (research scientists and PhD students), ra (research assistants), visiting (visiting students), alumni.
#     Core members and research assistants are lab members: they appear on the home page.
#   photo: a square-ish image in public/assets/team/, about 640px; leave it out to show initials
#   orcid / openalex: lets tools/find_papers.py look up new papers by the director and core members

director:
  name: Dakuo Wang
  title: Associate Professor
  photo: assets/team/dakuo.jpg
  url: https://www.dakuowang.com/
  email: d.wang@northeastern.edu
  orcid: 0000-0001-9371-9441
  bio:
  - >-
    Dakuo Wang is an Associate Professor at Northeastern University, jointly appointed in the Khoury College of
    Computer Sciences and the College of Arts, Media and Design.
  - >-
    His research sits where human-computer interaction meets artificial intelligence. He explores, builds, and evaluates
    human-centered AI systems, with the goal of making AI accessible to every person and every organization, and
    of helping people work with AI as a collaborator.

