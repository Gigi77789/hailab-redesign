# People on the Lab members page and the home page. Everyone listed here is bolded in author lists
# (nicknames in quotes or parentheses are ignored when matching, so “Bingsheng ‘Arthur’ Yao” matches “Bingsheng Yao”).
#   group: faculty (research scientists; the director is listed separately), phd, ra (research assistants),
#     visiting (visiting students), alumni. Faculty, PhD students and research assistants are lab members:
#     they appear on the home page.
#   bio: one short sentence for the Lab members page (under about 100 characters, so it fits in three lines)
#   photo: a square image in public/assets/team/, about 640px; leave it out to show initials
#   url: the person's website; their name links there in author lists too
#   aliases: other names the person publishes under, so those are bolded and linked as well
#   orcid / openalex: lets tools/find_papers.py look up new papers by the director, faculty and PhD students

director:
  name: Dakuo Wang
  title: Associate Professor
  role: Associate Professor, lab director
  short: Leads the lab. Builds and studies human-centered AI that people can work with as a collaborator.
  photo: assets/team/dakuo.jpg
  url: https://www.dakuowang.com/
  email: d.wang@northeastern.edu
  orcid: 0000-0001-9371-9441
  bio:
    - Dakuo Wang is an Associate Professor at Northeastern University, jointly appointed in the Khoury College
      of Computer Sciences and the College of Arts, Media and Design.
    - His research sits where human-computer interaction meets artificial intelligence. He explores, builds,
      and evaluates human-centered AI systems, with the goal of making AI accessible to every person and every
      organization, and of helping people work with AI as a collaborator.

