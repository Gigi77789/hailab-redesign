# Research areas on the home page, in this order. Each shows its newest papers: the papers in papers.bib
# whose main (first) topic is `topic`. Names come from categories.yaml. Keep `summary` under about
# 90 characters so it fits in two lines beside the list.

- topic: health
  summary: Decision support that fits how clinicians, patients, and caregivers already work.

- topic: education
  summary: AI that supports teachers, parents, and children instead of replacing them.

- topic: hac
  summary: How people talk to and team up with AI agents, from voice assistants to LLM agents.

- topic: collab
  summary: How people make decisions and do expert work together with AI.

- topic: algo
  summary: Building and training LLMs and agents, including agents that simulate real users.
