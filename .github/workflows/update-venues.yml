# Every Monday: promote preprints whose published version has appeared (tools/update_venues.py),
# link new papers to their venue (tools/venue_links.py), fetch missing figures (tools/fetch_figures.py),
# commit the data change, and redeploy the review copy. Run it by hand from the Actions tab too.
name: Update preprint venues
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look up preprints, venue links, and figures
        run: |
          python3 tools/update_venues.py
          python3 tools/venue_links.py
          python3 tools/fetch_figures.py
      - name: Commit and redeploy if anything changed
        run: |
          if git diff --quiet data/pubs.js && [ -z "$(git status --porcelain assets/papers)" ]; then echo "No preprints were published this week."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pubs.js assets/papers *.html
          git commit -m "Update preprint venues, venue links, and figures"
          git push
          sh tools/deploy.sh
