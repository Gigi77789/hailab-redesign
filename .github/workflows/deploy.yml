# Republishes the site whenever main changes, including every save from the site editor (admin.html):
# builds it (a data file the build rejects stops here) and pushes the review copy to gh-pages with tools/deploy.sh.
# To publish somewhere else later (a Northeastern server, Netlify, ...), replace the last step with that
# host's upload step; the editor needs no change.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build and publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sh tools/deploy.sh
